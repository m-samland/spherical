[workspace]
name = "spherical"
description = "VLT/SPHERE Instrument Calibration Pipeline and Database"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

# ──────────────────────────────────────────────
# Core dependencies (mirrors [project.dependencies] in pyproject.toml)
# ──────────────────────────────────────────────
[dependencies]
python = ">=3.11,<3.14"
numpy = ">=2.0,<3.0"
matplotlib = ">3.0,<4.0"
pandas = ">2.0,<=3.0"
astropy = ">=7.1,<8.0"
astroquery = ">=0.4.8,<=0.4.10"
tqdm = "*"
natsort = "*"
astropy-healpix = "*"
python-json-logger = "*"
pymysql = ">=1.1.2,<2"

# Editable install of the package itself
[pypi-dependencies]
spherical = { path = ".", editable = true }

# ──────────────────────────────────────────────
# Feature: pipeline (published versions, for regular users: charis from git,
# trap-hci from PyPI)
# ──────────────────────────────────────────────
[feature.pipeline.dependencies]
numpy = ">=2.0,<2.5"  # numba (via trap) requires numpy<2.5
dill = "*"
scikit-image = "*"
photutils = "*"
scipy = ">=1.9.3"

[feature.pipeline.pypi-dependencies]
charis = { git = "https://github.com/PrincetonUniversity/charis-dep" }
# Published on PyPI as trap-hci (see pyproject.toml); the import name is still `trap`.
trap-hci = ">=2.1"

# ──────────────────────────────────────────────
# Feature: dev-pipeline (local editable installs, for developers)
# Uses same conda deps as pipeline but installs charis/trap from
# local sibling directories (../charis-dep/ and ../trap/) in editable mode.
# Cannot be combined with feature.pipeline in the same environment.
# ──────────────────────────────────────────────
[feature.dev-pipeline.dependencies]
numpy = ">=2.0,<2.5"  # numba (via trap) requires numpy<2.5
dill = "*"
scikit-image = "*"
photutils = "*"
scipy = ">=1.9.3"

[feature.dev-pipeline.pypi-dependencies]
charis = { path = "../charis-dep", editable = true }
trap-hci = { path = "../trap", editable = true }

# ──────────────────────────────────────────────
# Feature: notebook
# ──────────────────────────────────────────────
[feature.notebook.dependencies]
ipython = "*"
jupyterlab = "*"
ipywidgets = "*"  # enables tqdm.auto widget progress bars in JupyterLab
seaborn = "*"
nb-clean = ">=4"  # docs-tutorials: strips execution counts, keeps outputs and tags
myst-nb = "*"  # myst_nb.glue in the tutorial notebooks

# ──────────────────────────────────────────────
# Feature: docs
# ──────────────────────────────────────────────
[feature.docs.dependencies]
numpy = ">=2.0,<2.5"  # numba (via trap) requires numpy<2.5
sphinx = ">=8"
myst-nb = "*"
pydata-sphinx-theme = "*"
sphinx-design = "*"
sphinx-copybutton = "*"
sphinx-argparse = ">=0.5"
sphinx-autobuild = "*"
dill = "*"
scikit-image = "*"
photutils = "*"
scipy = ">=1.9.3"

[feature.docs.pypi-dependencies]
# autodoc imports run_trap and friends; trap-hci resolves their TRAP types.
trap-hci = ">=2.1"

# ──────────────────────────────────────────────
# Feature: test
# ──────────────────────────────────────────────
[feature.test.dependencies]
# The `test` extra in pyproject.toml minus trap-hci: this env shares the `default` solve
# group, and trap would pull numba and its numpy<2.5 cap into the database-only env.
# tests/pipeline runs here with the charis/trap tests skipped; -e dev or -e dev-git runs them.
dill = "*"
scikit-image = "*"
photutils = "*"
scipy = ">=1.9.3"
pytest = "*"
pytest-cov = "*"
pytest-doctestplus = "*"
# Replays recorded ESO archive traffic so the resume tests run offline; see
# tests/database/cassettes/README.md for how to re-record.
pytest-recording = "*"
codecov = "*"
ruff = "*"

# ──────────────────────────────────────────────
# Environments
# ──────────────────────────────────────────────
[environments]
default = { solve-group = "default" }
pipeline = { features = ["pipeline"], solve-group = "pipeline" }
notebook = { features = ["notebook"], solve-group = "default" }
# Own solve group: trap-hci brings numba and numpy<2.5, which must not enter `default`.
docs = { features = ["docs"], solve-group = "docs" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev-pipeline", "notebook", "test"], solve-group = "dev" }
# Self-contained dev env: same as `dev` but installs charis from git and trap-hci from
# PyPI instead of local siblings. Use when ../charis-dep/ and ../trap/ are not checked out.
dev-git = { features = ["pipeline", "notebook", "test"], solve-group = "pipeline" }

# ──────────────────────────────────────────────
# Tasks
# ──────────────────────────────────────────────
[feature.pipeline.tasks]
ipython = "ipython"

[feature.dev-pipeline.tasks]
ipython = "ipython"

[feature.notebook.tasks]
# Execute a tutorial notebook in place, strip execution counts and cell metadata except
# tags, then stamp it and drop widget outputs (docs/tools/stamp_notebook.py). Reduction tutorials read products
# from $SPHERICAL_TUTORIAL_DIR, written by docs/tutorials/runs/<name>.py.
# Usage: pixi run -e dev docs-tutorials 51eri_irdis   (name without .ipynb)
docs-tutorials = { args = ["notebook"], cmd = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=1800 --ExecutePreprocessor.store_widget_state=False docs/tutorials/{{ notebook }}.ipynb && nb-clean clean -o -m tags -- docs/tutorials/{{ notebook }}.ipynb && python docs/tools/stamp_notebook.py docs/tutorials/{{ notebook }}.ipynb" }

[feature.test.tasks]
# Subject is selected by path; the cost filter comes from addopts in pyproject.toml.
# test-network / test-regression pass their own `-m`, which REPLACES that default —
# that is deliberate, and why the two subject tasks pass none.
test = "pytest"                                              # fast, no network
test-pipeline = "pytest tests/pipeline"                      # charis/trap tests need -e dev
test-database = "pytest tests/database"
test-network = "pytest tests/database -m 'remote_data'"      # ~19 min against ESO
test-regression = "pytest tests/regression -m 'regression'"
test-all = "pytest -m ''"                                    # pre-release gate
lint = "ruff check src/ tests/ docs/tools docs/_ext docs/tutorials --extend-exclude '*.ipynb'"
format = "ruff format src/"
format-check = "ruff format --check src/"
test-docs = "pytest tests/docs"

[feature.docs.tasks]
# -W turns warnings into errors (as on Read the Docs); --keep-going reports all of them.
# Offline? SPHINX_OFFLINE=1 skips intersphinx inventories.
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
docs-live = "sphinx-autobuild docs docs/_build/html --watch src"
docs-clean = "rm -rf docs/_build docs/reference/api/generated docs/jupyter_execute"
