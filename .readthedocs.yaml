# Read the Docs build for https://spherical-hci.readthedocs.io
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # setuptools_scm needs the full history and the tags to compute the version.
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats: []
