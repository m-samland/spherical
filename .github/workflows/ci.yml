name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  lint:
    name: 🧹 Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff check
        run: |
          ruff check .

  test:
    name: 🧪 Test with pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint  # Ensures linting passes before running tests

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run pytest
        # Database subject only: this env installs `.[test]`, not the pipeline extra.
        # The addopts default keeps it off the network, so no credentials are needed
        # and archive rate-limiting cannot turn the build red.
        #
        # test_config.py is the one pipeline-subject module named explicitly, because
        # pipeline_config.py is deliberately stdlib-only so a base install can build a
        # config. That makes it the only pipeline surface this env can exercise, and it
        # needs the version matrix: the interpreter-specific dataclass(slots=True)
        # breakage it guards against is invisible to a single-version run.
        # test_pipeline_config_imports_only_stdlib keeps the premise honest, so adding a
        # heavy import to pipeline_config.py fails the assertion rather than the job.
        run: |
          pytest tests/database tests/pipeline/test_config.py

  pipeline-test:
    name: 🔭 Test pipeline steps with pytest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The `pipeline` extra pulls charis and trap from git, and charis carries
        # a large set of calibration files. Installing only the PyPI half keeps
        # this job small and stops an unrelated upstream repo from turning the
        # build red. Modules that genuinely need trap or species guard themselves
        # with importorskip, so they skip here rather than fail.
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" dill scikit-image photutils "scipy>=1.9.3"

      - name: Run pytest
        # Single interpreter: the version matrix exists for test_config.py, which
        # the database job already runs across 3.11-3.13. What this job adds is
        # subject coverage — the reduction steps themselves, which no job
        # exercised before. The addopts default keeps it off the network.
        run: |
          pytest tests/pipeline
