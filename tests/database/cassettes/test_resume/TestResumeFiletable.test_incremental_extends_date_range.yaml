        from <a href=\"http://archive.eso.org/cms/eso-data/ambient-conditions/paranal-ambient-query-forms.html\">here.</a><br></div>\n</span>\n<div
        class=\"raw_hide_public_show_cas\" id=\"special_access_info\">\n<!-- BEGIN
        Special Access Box -->\n<div class=\"access_info_container\" style=\"position:relative;\">\n<script
        type=\"text/javascript\">\nfunction toggling_access_info()\n{\n$('.access_info').toggle();\nif
