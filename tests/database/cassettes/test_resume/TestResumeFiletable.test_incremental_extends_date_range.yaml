        vertical-align:middle; float:right; font-size:10px\" title=\"click to hide\">
        [close]</span>');\n}\n}\n</script>\n<table style=\"width: 100%\">\n<tr>\n<td>\n<div
        class=\"btn_access_info\" style=\"width:440px; padding-left: 10px; padding-right:
        10px; text-align: center; font-size:15px;position:relative;left:40px;top:11px;background-color:rgb(139,0,0);color:white;border-radius:5px;
        display:inline-block; vertical-align:middle\" onclick=\"toggling_access_info();\"><span
        style=\"letter-spacing: 12px; font-family: verdana; display:inline-block;
        vertical-align:middle\" title=\"click to expand\">Special Access Info</span><span
        style=\"font-family:verdana; vertical-align:middle; float:right; font-size:10px;\"
        title=\"click to expand\"> [open]</span></div>\n<div class=\"access_info\"
        style=\"min-width: 900px !important; text-align: justify; font-size:110%;
        padding:20px;border-radius:15px;border:5px solid rgb(139,0,0); display: none\">\n<table
        cellpadding=\"15\">\n<tr>\n<td widht=\"70%\" valign=\"top\"><h3>Special access
        interface</h3>\n<em>This query form allows logged-on users to browse SPHERE
        raw data beyond what possible with the <a href=\"/wdb/wdb/eso/sphere/form\">public
        SPHERE interface</a>.\nA query will return any matching public (raw) asset,
        plus any other (raw) asset for which the user has been granted special permissions,\nas
        it is the case for instrument teams, PIs of special programmes, etc.<br>\n</em>\n<p>\n<h3>Other
        public interfaces</h3>\n<em>\nUsing the query forms listed below, you can
        only browse public assets (no credentials requested):\n<ul>\n<li> <b><a href=\"http://archive.eso.org/eso/eso_archive_main.html\">ESO
        raw data query form</a></b>\n<li> <b><a href=\"http://archive.eso.org/cms/eso-data/instrument-specific-query-forms.html\">Instrument-dedicated
        query forms</a></b> (raw data)\n<li> <b><a href=\"/wdb/wdb/adp/phase3_main/form\">Phase
        3 query form</a></b> (science reduced or fully calibrated data)\n</ul>\n</em>\n</td>\n<td
        width=\"30%\" align=\"right\" valign=\"top\">\n<table><tr><td align=\"left\">\n<h3>How
        to change user</h3>\n<em>To change user, please:\n<ol>\n<li>Copy <a id='copy_link'
        title=\"Use the Copy Link Location option (right click), then sign out, then
        paste the copied link into your browser again.\" href=\"\">this link</a> (right
        click).\n<li>Logout pressing the Special Access Sign Out button\n<li>Paste
        the copied link into the browser location again.\n</ol>\n</em>\n</td></tr></table>\n</td>\n</tr>\n</table>\n</div>
        <!-- end of alsoavailable div -->\n</td><td align=\"right\">\n<form id='logout'
