        src=\"/wdb/jslib/jquery/1.8.3/jquery.min.js\"></script>\n<script type=\"text/javascript\"><!--\n$(document).ready(
        function() {\nchangeLabels();\n$(\"#myreset\").click(function(){\n$(\"#coord_sys\").val('eq');\nchangeLabels();\n$(\"#dp_type\").attr(\"disabled\",
        false);\n$(\"#dp_tech\").attr(\"disabled\", false);\n$(\"#dp_cat\").attr(\"disabled\",
        false);\n});\n$(\"[name=dp_type_user]\").change(function(){\n$(\"#dp_type\").attr(\"disabled\",
        true);\n}).blur(function() {\nif($(\"[name=dp_type_user]\").val().length ==
        0) {\n$(\"#dp_type\").attr(\"disabled\", false);\n} else {\n$(\"#dp_type option:first\").attr('selected','selected');\n}\n});\n$(\"[name=dp_tech_user]\").change(function(){\n$(\"#dp_tech\").attr(\"disabled\",
        true);\n}).blur(function() {\nif($(\"[name=dp_tech_user]\").val().length ==
        0) {\n$(\"#dp_tech\").attr(\"disabled\", false);\n} else {\n$(\"#dp_tech option:first\").attr('selected','selected');\n}\n});\n$(\"[name=dp_cat_user]\").change(function(){\n$(\"#dp_cat\").attr(\"disabled\",
        true);\n}).blur(function() {\nif($(\"[name=dp_cat_user]\").val().length ==
        0) {\n$(\"#dp_cat\").attr(\"disabled\", false);\n} else {\n$(\"#dp_cat option:first\").attr('selected','selected');\n}\n});\n//
        Function to truncate text (Read More, Read Less) is applied to any element
        of the class textContainer_Truncate\n// line height in 'px' is set to 44,
        height which is currently hardcoded for all elements.\nvar maxheightText=1;\nvar
        showText = \"[+] Read more ...\";\nvar hideText = \"[-] Read less\";\njQuery('.textContainer_Truncate').each(function
        () {\ntruncate_text( this, maxheightText, showText, hideText, \"\" );\n});\n});\nfunction
        changeLabels()\n{\nvar coordsys=$(\"#coord_sys\").val();\nvar label1=\"RA\";\nvar
        label2=\"DEC\";\nvar unitlabel_coord1=\"RA: sexagesimal/hours, decimal/degrees\";\nif
        (coordsys == \"gal\")\n{\nlabel1=\"l \";\nlabel2=\"b \";\nunitlabel_coord1=\"both
        degrees whether sexagesimal or decimal\";\n}\n$('#coord1_label').html(label1);\n$('#coord2_label').html(label2);\n$('#unitlabel_coord1').html(unitlabel_coord1);\n//document.getElementById(\"coord1_label\").innerHTML
        = label1;\n//document.getElementById(\"coord2_label\").innerHTML = label2;\n//document.getElementById(\"unitlabel_coord1\").innerHTML
        = unitlabel_coord1;\n}\nfunction resetLabels()\n{\nvar label1=\"RA\";\nvar
        label2=\"DEC\";\nvar unitlabel_coord1=\"RA: sexagesimal/hours, decimal/degrees\";\n$('#coord1_label').html(label1);\n$('#coord2_label').html(label2);\n$('#unitlabel_coord1').html(unitlabel_coord1);\n}\nfunction
        truncate_text( obj, maxheight, more_label, less_label, urltarget)\n{\nvar
        text = jQuery(obj);\nif (text.height() > maxheight){\ntext.css({ 'overflow':
        'hidden','height': maxheight + 'px' });\nvar link = jQuery('<a style=\"color:rgb(150,0,96);
        text-decoration:none; font-size: 75%; font-weight: bold;\" href=\"#' + urltarget
        + '\">' + more_label + '</a>');\nvar linkDiv = jQuery('<div></div>');\nlinkDiv.append(link);\njQuery(obj).after(linkDiv);\nlink.click(function
        (event) {\nevent.preventDefault();\nif (text.height() > maxheight) {\njQuery(this).html(more_label);\ntext.css('height',
        maxheight + 'px');\n} else {\njQuery(this).html(less_label);\ntext.css('height',
        'auto');\n}\n});\n}\n}\n//-->\n</SCRIPT>\n<script type=\"text/javascript\"
        src=\"/wdb/jslib/wdb_query_functions.js\"></script>\n</HEAD>\n<BODY onunload=\"\"
